#cloud-config
# Delivered as cloud-init VENDOR-data, not user-data. User-data would REPLACE
# the user/ssh-key config Proxmox generates from the initialization block,
# locking you out of the guest. Vendor-data is merged alongside it instead.
package_update: true
package_upgrade: false

packages:
  # Without this the host cannot fsfreeze the guest, so vzdump backups are
  # crash-consistent rather than filesystem-consistent. Debian's genericcloud
  # image does not include it.
  - qemu-guest-agent

runcmd:
  - systemctl enable --now qemu-guest-agent
