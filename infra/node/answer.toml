# =============================================================================
#  Proxmox VE automated installation - answer.toml
#
#  Validate every time before use:
#      proxmox-auto-install-assistant validate-answer answer.toml
# =============================================================================

[global]
keyboard = "en-us"
country  = "vn"

# ---- CHANGE ME (1 of 4) ------------------------------------------------------
fqdn = ""   # change FQDN for each PVE node
# ------------------------------------------------------------------------------

mailto   = "root@nggocnn.internal"
timezone = "Asia/Ho_Chi_Minh"

# ---- CHANGE ME (2 of 4) ------------------------------------------------------
root-password-hashed = ""
# ------------------------------------------------------------------------------

# ---- CHANGE ME (3 of 4) ------------------------------------------------------
root-ssh-keys = [
  'cert-authority,principals="pve-root" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGYHCiLUnSrJmh/2U1/KjWFycXeALtY8O7PdgXfzaLQ2 user_ca.nggocnn.internal',
  'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ7LgxjW0DOvD/mcekq8tvFHg6ITG2VRaoU96Bhy36uP break-glass.nggocnn.internal',
]
# ------------------------------------------------------------------------------

reboot-on-error = false
reboot-mode     = "reboot"

[network]
source = "from-answer"

# ---- CHANGE ME (4 of 4) ------------------------------------------------------
cidr = "10.10.10.11/24"         # change CIDR for each PVE node
# ------------------------------------------------------------------------------

gateway = "10.10.10.1"
dns     = "10.10.10.1"          # gateway; 14-dns-clients.yml moves it to dns_vip

# Exactly one Ethernet port per P330, so a wildcard is safe and name-agnostic.
filter.ID_NET_NAME = "en*"

# ZFS on the single NVMe: storage `local-zfs`, which storage replication and Proxmox HA
# need on every node. raid0 = one disk, no redundancy. The tank HDD on pve-01 is not in
# disk-list, so the installer never touches it. No ARC limit here: the installer caps it
# at 10% of RAM per machine (wiki 044). No swap: ZFS installs leave it out.
[disk-setup]
filesystem   = "zfs"
disk-list    = ["nvme0n1"]
zfs.raid     = "raid0"
zfs.ashift   = 12
zfs.compress = "lz4"

[first-boot]
source   = "from-iso"
ordering = "fully-up"