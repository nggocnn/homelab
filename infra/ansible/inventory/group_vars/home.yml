---
# home-01: Home Assistant and ESPHome in Docker (stacks/home), on pve-02, replicated to pve-03.
# Overrides group_vars/docker.yml, which it inherits as a child of `docker`.
# Bluetooth comes in over the network from ESP32s running ESPHome Bluetooth proxies, so there
# is no USB passthrough and nothing pins this VM to one node.

# --- vm ---------------------------------------------------------------------
vm_cores: 2
vm_memory_mb: 4096
vm_disk_gb: 32

# --- stacks (31-stacks.yml) -------------------------------------------------
compose_stacks:
  - home
