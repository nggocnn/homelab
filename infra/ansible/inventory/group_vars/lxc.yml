---
# --- connection -------------------------------------------------------------
# Container-only key, never authorised on the nodes.
ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/lxc.nggocnn.internal
ansible_python_interpreter: /usr/bin/python3

# --- dns ---------------------------------------------------------------------
# Steady state, applied by 14-dns-clients.yml. Creation uses pve_lxc's default, the
# gateway, because dns_vip does not exist yet on a first build.
# The VIP alone: keepalived is the redundancy, and a gateway fallback would answer
# without filtering and without the internal names.
lxc_resolvers: "{{ dns_vip }}"

# --- access -----------------------------------------------------------------
# Root's keys, applied by 03-lxc at creation and by guest_ssh. Additive, never pruned.
lxc_root_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIB5fkwTEbG6Ldkksg4wg9YMcBOeaqgcoZStFVTklvbQ lxc.nggocnn.internal"
guest_ssh_root_authorized_keys: "{{ lxc_root_authorized_keys }}"

# --- container ----------------------------------------------------------------
# Sizing and network defaults: roles/pve_lxc/defaults/main.yml.
lxc_pool: network

# --- packages -----------------------------------------------------------------
# Every container. Extras per play with apt_packages.
apt_packages_base:
  - ca-certificates
  - curl
