---
# --- connection -------------------------------------------------------------
# The key whose public half went into answer.toml's root-ssh-keys. first-boot.sh
# set PermitRootLogin prohibit-password, so this key is the only way in over SSH.
ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/pve.nggocnn.internal
ansible_python_interpreter: /usr/bin/python3

# --- cluster ----------------------------------------------------------------
pve_cluster_name: pve
pve_cluster_primary: "{{ groups['pve_primary'][0] }}"

# Resource pools grouping LXC and VMs, one per guest block (VMID = IP last octet).
pve_pools:
  - { id: network,            comment: "10.10.10.100-119 | edge, VPN and DNS" }
  - { id: access,             comment: "10.10.10.120-139 | entry points: bastion, remote desktop" }
  - { id: infrastructure,     comment: "10.10.10.140-149 | shared services" }
  - { id: container-platform, comment: "10.10.10.150-169 | Docker hosts" }
  - { id: kubernetes-lab,     comment: "10.10.10.170-199 | on-demand Kubernetes lab" }

# --- vip --------------------------------------------------------------------
# pve_vip floats across the three nodes, so the web UI and the API have one address.
# pveproxy forwards to whichever node owns a resource, so any single node is already a
# complete entry point - the VIP is only what keeps that address alive when one goes.
# Same priorities as the dns group: 150 / 100 / 50 by position in the group.
keepalived_vip: "{{ pve_vip }}"
keepalived_interface: vmbr0
keepalived_priority: "{{ 150 - (groups['pve'].index(inventory_hostname) * 50) }}"
keepalived_peers: "{{ groups['pve'] | reject('equalto', inventory_hostname) | map('extract', hostvars, 'ansible_host') | list }}"
keepalived_router_id: 50

# A request, not `systemctl is-active`: a hung pveproxy is still active. And quorum,
# because a node outvoted in a partition serves a UI that can change nothing.
keepalived_scripts:
  - name: chk_pveproxy
    script: "/usr/bin/curl -sfk -o /dev/null --max-time 2 https://127.0.0.1:8006/"
  - name: chk_quorum
    script: "/etc/keepalived/scripts/quorum-check"

# --- dns --------------------------------------------------------------------
# dns1..dns3, in order. The VIP first; the gateway behind it so a node can still
# resolve for apt and chrony while the resolver pair is down.
pve_dns_servers:
  - "{{ dns_vip }}"
  - "{{ pve_gateway }}"

# --- images -----------------------------------------------------------------
# Put on every node: `url`/pveam name downloads on the node, `src` pushes from local machine.
# Additive: removing an entry deletes nothing.
pve_images_storage: local

pve_lxc_templates:
  - debian-13-standard_13.6-1_amd64.tar.zst # pveam available --section system
  # - name: template.tar.zst
  #   src: <local_template_path>

pve_isos:
  - name: ubuntu-24.04.4-live-server-amd64.iso
    url: https://releases.ubuntu.com/24.04.4/ubuntu-24.04.4-live-server-amd64.iso
    # src: <local_iso_path>
    checksum: sha256:e907d92eeec9df64163a7e454cbc8d7755e8ddc7ed42f99dbc80c40f1a138433

# --- host convergence -------------------------------------------------------
# Public keys that may log in as root. Additive: existing keys are never pruned,
# because pruning the wrong one locks all three nodes out at once.
pve_root_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN/HHFuOPfJ2ccXo2XNHVzU0prgcVZu33CmXPLGqLk+s pve.nggocnn.internal"

# intel_pstate's "powersave" still reaches full turbo under load - it is a ramp
# policy, not a frequency cap, and it matters on three always-on boxes.
pve_cpu_governor: powersave

# VT-d passthrough. iommu=pt limits IOMMU translation to passed-through devices,
# so host devices keep their normal DMA path.
pve_kernel_params:
  - intel_iommu=on
  - iommu=pt

# --- behaviour toggles ------------------------------------------------------
pve_repo_no_subscription: true   # enterprise repo off, no-subscription on

# download.proxmox.com GeoDNS rotates between sg and au here, and au runs days
# behind - which left the three nodes on different pve-manager versions. Pinned
# so all three see one index. Revert to download.proxmox.com to regain failover.
pve_repo_host: sg.cdn.proxmox.com

pve_disable_ceph_repo: true      # not using Ceph
pve_remove_nag: true
pve_nic_offload_fix: true        # I219-LM e1000e hang workaround
pve_iommu: true
pve_wol: true                    # `pvenode wakeonlan <node>` from a peer
pve_unattended_upgrades: true
pve_do_dist_upgrade: false       # opt in with -e pve_do_dist_upgrade=true
pve_allow_reboot: true           # -e pve_allow_reboot=false to disarm
