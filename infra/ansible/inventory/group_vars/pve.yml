---
# --- connection -------------------------------------------------------------
ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/pve.nggocnn.io
ansible_python_interpreter: /usr/bin/python3


# --- hardware ---------------------------------------------------------------
# PVE 9 stable interface naming: the onboard I219-LM is nic0, NOT eno1.
pve_nic: nic0

# --- cluster ----------------------------------------------------------------
pve_cluster_name: pve
pve_primary: "{{ groups['pve_primary'][0] }}"

# --- behaviour toggles ------------------------------------------------------
pve_repo_no_subscription: true   # enterprise repo off, no-subscription on
pve_disable_ceph_repo: true      # not using Ceph
pve_remove_nag: true
pve_nic_offload_fix: true        # I219-LM e1000e hang workaround
pve_cpu_governor: powersave      # intel_pstate offers: performance | powersave
pve_unattended_upgrades: true
pve_do_dist_upgrade: false       # set true (or -e) to run a full upgrade

# --- automation identity ----------------------------------------------------
pve_automation_user: automation           # system user for SSH (OpenTofu file uploads)
pve_automation_key: ~/.ssh/automation.nggocnn.io
pve_api_user: automation@pve              # PVE API user
pve_api_token_name: tofu
pve_api_role: Automation

# --- guests -----------------------------------------------------------------
pve_tailscale_ctid: 106
