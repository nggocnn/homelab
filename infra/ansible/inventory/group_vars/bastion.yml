---
# --- connection -------------------------------------------------------------
# Through the node with `pct exec` - root has no SSH login here. Needs python3-paramiko.
ansible_connection: community.proxmox.proxmox_pct_remote
ansible_paramiko_host: "{{ hostvars[lxc_node].ansible_host }}"
ansible_paramiko_private_key_file: "{{ hostvars[lxc_node].ansible_ssh_private_key_file }}"
proxmox_vmid: "{{ ansible_host.split('.')[-1] }}"

# --- container ----------------------------------------------------------------
lxc_pool: access

# --- ssh --------------------------------------------------------------------
guest_ssh_config: bastion.conf
guest_ssh_root_authorized_keys: "{{ lxc_root_authorized_keys }}"

# nggocnn logs in with these; the console uses the password.
bastion_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBYFQr/IXgIKHqh+ex/PKzRgC6z06i+gnR1bEl2yDr/4 bastion.nggocnn.internal"
