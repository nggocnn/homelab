---
# Node identity lives here and nowhere else. /etc/hosts, the corosync links and
# the FQDN asserts are all derived from these three entries, so a node's address
# cannot drift between the installer, the hypervisor and the playbooks.
all:
  children:
    pve:
      hosts:
        pve-01:
          ansible_host: 10.10.10.11
        pve-02:
          ansible_host: 10.10.10.12
        pve-03:
          ansible_host: 10.10.10.13

    # The node the cluster is created on, and where cluster-wide config (pools,
    # users, tokens) is applied exactly once. Referenced as pve_cluster_primary.
    pve_primary:
      hosts:
        pve-01:
