---
# Node identity lives here and nowhere else. /etc/hosts, the corosync links and
# the FQDN asserts are all derived from these entries, so a node's address
# cannot drift between the installer, the hypervisor and the playbooks.
all:
  children:
    pve:
      hosts:
        pve-01:   # i7-9700, 32 GB: the HDD and most of the containers
          ansible_host: 10.10.10.11
          # The 1 TB HDD for the tank pool, by serial so a re-cabled disk is still found.
          pve_tank_disk: /dev/disk/by-id/ata-WDC_WD10JPVX-75JC3T0_WXK1A95AL5J3
        pve-02:   # i7-8700, 16 GB
          ansible_host: 10.10.10.12
        pve-03:   # i7-8700, 16 GB: a third vote, and where the replicated VMs fail over to
          ansible_host: 10.10.10.13

    # The node the cluster is created on, and where cluster-wide config (pools,
    # users, tokens) is applied exactly once. Referenced as pve_cluster_primary.
    pve_primary:
      hosts:
        pve-01:

    # Containers, created on lxc_node by the playbook of their group. VMID = last octet of ansible_host.
    lxc:
      children:
        cloudflared:
          hosts:
            cloudflared-01: { ansible_host: 10.10.10.101, lxc_node: pve-01 }
            cloudflared-02: { ansible_host: 10.10.10.102, lxc_node: pve-02 }
            cloudflared-03: { ansible_host: 10.10.10.103, lxc_node: pve-03 }
        tailscale:
          hosts:
            tailscale-01: { ansible_host: 10.10.10.104, lxc_node: pve-01 }
            tailscale-02: { ansible_host: 10.10.10.105, lxc_node: pve-02 }
            tailscale-03: { ansible_host: 10.10.10.106, lxc_node: pve-03 }
        dns:
          hosts:
            dns-01: { ansible_host: 10.10.10.107, lxc_node: pve-01 }
            dns-02: { ansible_host: 10.10.10.108, lxc_node: pve-02 }
            dns-03: { ansible_host: 10.10.10.109, lxc_node: pve-03 }
        bastion:
          hosts:
            bastion-01: { ansible_host: 10.10.10.120, lxc_node: pve-01 }
        beszel:
          hosts:
            beszel-01: { ansible_host: 10.10.10.140, lxc_node: pve-01 }
        kuma:
          hosts:
            kuma-01: { ansible_host: 10.10.10.141, lxc_node: pve-01 }
        monitor:
          hosts:
            monitor-01: { ansible_host: 10.10.10.142, lxc_node: pve-01 }
        pulse:   # on trial; see the monitoring comparison before keeping or dropping it
          hosts:
            pulse-01: { ansible_host: 10.10.10.143, lxc_node: pve-01 }
        nas:
          hosts:
            nas-01: { ansible_host: 10.10.10.144, lxc_node: pve-01 }   # bound to tank: never moves

    # VMs, created on vm_node by their playbook. VMID = last octet of ansible_host.
    # vm_replicate_to: a storage replication job to that node every 15 min, and an HA resource
    # that prefers vm_node and fails over there (04-ha.yml).
    vm:
      children:
        docker:
          hosts:
            docker-01: { ansible_host: 10.10.10.150, vm_node: pve-01, vm_replicate_to: pve-03 }
          children:
            # Docker hosts too (30-docker.yml), sized in group_vars/home.yml.
            home:
              hosts:
                home-01: { ansible_host: 10.10.10.151, vm_node: pve-02, vm_replicate_to: pve-03 }
