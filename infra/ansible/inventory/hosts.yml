---
# Node identity lives here and nowhere else. /etc/hosts, the corosync links and
# the FQDN asserts are all derived from these entries, so a node's address
# cannot drift between the installer, the hypervisor and the playbooks.
all:
  children:
    pve:
      hosts:
        pve-01:
          ansible_host: 10.10.10.11
          # The 1 TB HDD for the tank pool, by serial so a re-cabled disk is still found.
          pve_tank_disk: /dev/disk/by-id/ata-WDC_WD10JPVX-75JC3T0_WXK1A95AL5J3

    # The node the cluster is created on, and where cluster-wide config (pools,
    # users, tokens) is applied exactly once. Referenced as pve_cluster_primary.
    pve_primary:
      hosts:
        pve-01:

    # Containers, created on lxc_node by the playbook of their group. VMID = last octet of ansible_host.
    lxc:
      children:
        cloudflared:
          hosts:
            cloudflared-01: { ansible_host: 10.10.10.101, lxc_node: pve-01 }
        tailscale:
          hosts:
            tailscale-01: { ansible_host: 10.10.10.104, lxc_node: pve-01 }
        dns:
          hosts:
            dns-01: { ansible_host: 10.10.10.107, lxc_node: pve-01 }
        bastion:
          hosts:
            bastion-01: { ansible_host: 10.10.10.120, lxc_node: pve-01 }
        beszel:
          hosts:
            beszel-01: { ansible_host: 10.10.10.140, lxc_node: pve-01 }
        kuma:
          hosts:
            kuma-01: { ansible_host: 10.10.10.141, lxc_node: pve-01 }
        monitor:
          hosts:
            monitor-01: { ansible_host: 10.10.10.142, lxc_node: pve-01 }
        pulse:
          hosts:
            pulse-01: { ansible_host: 10.10.10.143, lxc_node: pve-01 }

    # VMs, created on vm_node by their playbook. VMID = last octet of ansible_host.
    vm:
      children:
        docker:
          hosts:
            docker-01: { ansible_host: 10.10.10.150, vm_node: pve-01 }
