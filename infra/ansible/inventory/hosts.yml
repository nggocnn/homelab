---
# Node identity lives here and nowhere else. /etc/hosts, the corosync links and
# the FQDN asserts are all derived from these three entries, so a node's address
# cannot drift between the installer, the hypervisor and the playbooks.
all:
  children:
    pve:
      hosts:
        pve-01:
          ansible_host: 10.10.10.11
        pve-02:
          ansible_host: 10.10.10.12
        pve-03:
          ansible_host: 10.10.10.13

    # The node the cluster is created on, and where cluster-wide config (pools,
    # users, tokens) is applied exactly once. Referenced as pve_cluster_primary.
    pve_primary:
      hosts:
        pve-01:

    # Containers, created on lxc_node by playbooks/03-lxc.yml. VMID = last octet of ansible_host.
    lxc:
      children:
        cloudflared:
          hosts:
            cloudflared-01: { ansible_host: 10.10.10.101, lxc_node: pve-01 }
            cloudflared-02: { ansible_host: 10.10.10.102, lxc_node: pve-02 }
            cloudflared-03: { ansible_host: 10.10.10.103, lxc_node: pve-03 }
        tailscale:
          hosts:
            tailscale-01: { ansible_host: 10.10.10.104, lxc_node: pve-01 }
            tailscale-02: { ansible_host: 10.10.10.105, lxc_node: pve-02 }
            tailscale-03: { ansible_host: 10.10.10.106, lxc_node: pve-03 }
        dns:
          hosts:
            dns-01: { ansible_host: 10.10.10.107, lxc_node: pve-01 }
            dns-02: { ansible_host: 10.10.10.108, lxc_node: pve-02 }
            dns-03: { ansible_host: 10.10.10.109, lxc_node: pve-03 }
        bastion:
          hosts:
            bastion-01: { ansible_host: 10.10.10.120, lxc_node: pve-02 }
        beszel:
          hosts:
            beszel-01: { ansible_host: 10.10.10.140, lxc_node: pve-01 }
        kuma:
          hosts:
            kuma-01: { ansible_host: 10.10.10.142, lxc_node: pve-01 }
