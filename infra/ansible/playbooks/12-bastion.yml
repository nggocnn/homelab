---
# Gate to the guests: nggocnn with a password (console, sudo) and a key (SSH).
# Re-run after adding a container or VM so the bastion key is authorised on it.
#
#   mkpasswd -m yescrypt > bastion-password.hash
#   ansible-playbook playbooks/12-bastion.yml
- name: Bastion
  hosts: bastion
  gather_facts: false
  roles:
    - bastion

- name: Authorise the bastion on the guests
  hosts: lxc:vm
  gather_facts: false
  tasks:
    - name: Authorise the bastion key for {{ ansible_user }}
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ hostvars[groups['bastion'][0]].bastion_public_key }}"
        state: present
        exclusive: false
