---
# pulse-01: Pulse, reading the cluster through the Proxmox API with a read-only token, and
# an agent on each node for what the API lacks: temperatures, SMART, the host's own metrics.
# A trial beside Beszel and Uptime Kuma - no notifications, so nothing alerts twice.
#
#   (umask 077; read -rsp 'Pulse password: ' p && printf '%s' "$p" > pulse-password; unset p)
#   ansible-playbook playbooks/24-pulse.yml
#
# Update: set pulse_version in group_vars/all.yml, then re-run. The server's data is copied to
# /etc/pulse.pre-upgrade first, the agents follow the same version, and the run fails unless the
# new version answers. A run with nothing to do says when a newer release is out.
- name: Controller certificate
  ansible.builtin.import_playbook: _ssh-cert.yml

- name: Pulse
  hosts: pulse
  gather_facts: false
  roles:
    - pve_lxc
    - guest_ssh
    - apt_packages
    - pulse

- name: Pulse agents
  hosts: pve
  gather_facts: false
  roles:
    - pulse_agent
