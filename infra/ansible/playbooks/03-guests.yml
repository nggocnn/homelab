---
# Guest-side host configuration that the API token is not permitted to do.
#
# Device passthrough is root@pam-only in PVE, so OpenTofu (which authenticates
# with the least-privilege automation token) cannot attach /dev/net/tun. It is
# done here over the root SSH channel instead.
#
#   ansible-playbook playbooks/03-guests.yml

- name: Attach /dev/net/tun to the Tailscale container
  hosts: pve_primary
  gather_facts: false
  tasks:
    - name: Check the container's current devices
      ansible.builtin.command: pct config {{ pve_tailscale_ctid }}
      register: _ctconf
      changed_when: false
      check_mode: false

    - name: Attach the TUN device
      ansible.builtin.command: >-
        pct set {{ pve_tailscale_ctid }} --dev0 /dev/net/tun
      when: "'/dev/net/tun' not in _ctconf.stdout"
      register: _attached

    - name: Restart the container to pick up the device
      ansible.builtin.command: pct reboot {{ pve_tailscale_ctid }}
      when: _attached is changed

    - name: Verify the device is present inside the container
      ansible.builtin.command: pct exec {{ pve_tailscale_ctid }} -- test -c /dev/net/tun
      register: _tun
      until: _tun.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      check_mode: false

# Cloud-init user-data is delivered as a snippet file, which requires the
# 'snippets' content type on a storage. storage.cfg is cluster-wide, so this
# runs once on the primary. OpenTofu cannot do it: Datastore.Allocate covers
# creating storages, not editing their content types.
- name: Enable snippets on local storage
  hosts: pve_primary
  gather_facts: false
  tasks:
    - name: Read current content types for local
      ansible.builtin.command: pvesh get /storage/local --output-format json
      register: _localstore
      changed_when: false
      check_mode: false

    - name: Add snippets to local storage content types
      ansible.builtin.command: pvesm set local --content iso,vztmpl,backup,import,snippets
      when: "'snippets' not in (_localstore.stdout | from_json).content"

    - name: Confirm snippets is enabled
      ansible.builtin.command: pvesh get /storage/local --output-format json
      register: _after
      changed_when: false
      check_mode: false
      failed_when: "'snippets' not in (_after.stdout | from_json).content"

# Debian services hardened with systemd user namespaces (prometheus, grafana,
# and others) fail in an unprivileged container without nesting. The API allows
# setting nesting alone, but rejects the provider's write because it sends the
# whole feature struct - so it is set here instead.
- name: Enable nesting on containers that need it
  hosts: pve_primary
  gather_facts: false
  vars:
    nesting_ctids: [142]
  tasks:
    - name: Check current features
      ansible.builtin.command: pct config {{ item }}
      register: _ctfeat
      changed_when: false
      check_mode: false
      loop: "{{ nesting_ctids }}"

    - name: Enable nesting
      ansible.builtin.command: pct set {{ item.item }} --features nesting=1
      when: "'nesting=1' not in item.stdout"
      loop: "{{ _ctfeat.results }}"
      loop_control:
        label: "ct {{ item.item }}"
      register: _nested

    - name: Restart containers that gained nesting
      ansible.builtin.command: pct reboot {{ item.item.item }}
      when: item is changed
      loop: "{{ _nested.results }}"
      loop_control:
        label: "ct {{ item.item.item | default('') }}"
