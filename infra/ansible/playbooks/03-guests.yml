---
# Guest-side host configuration that the API token is not permitted to do.
#
# Device passthrough is root@pam-only in PVE, so OpenTofu (which authenticates
# with the least-privilege automation token) cannot attach /dev/net/tun. It is
# done here over the root SSH channel instead.
#
#   ansible-playbook playbooks/03-guests.yml

- name: Attach /dev/net/tun to the Tailscale container
  hosts: pve_primary
  gather_facts: false
  tasks:
    - name: Check the container's current devices
      ansible.builtin.command: pct config {{ pve_tailscale_ctid }}
      register: _ctconf
      changed_when: false
      check_mode: false

    - name: Attach the TUN device
      ansible.builtin.command: >-
        pct set {{ pve_tailscale_ctid }} --dev0 /dev/net/tun
      when: "'/dev/net/tun' not in _ctconf.stdout"
      register: _attached

    - name: Restart the container to pick up the device
      ansible.builtin.command: pct reboot {{ pve_tailscale_ctid }}
      when: _attached is changed

    - name: Verify the device is present inside the container
      ansible.builtin.command: pct exec {{ pve_tailscale_ctid }} -- test -c /dev/net/tun
      register: _tun
      until: _tun.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      check_mode: false

# Cloud-init user-data is delivered as a snippet file, which requires the
# 'snippets' content type on a storage. storage.cfg is cluster-wide, so this
# runs once on the primary. OpenTofu cannot do it: Datastore.Allocate covers
# creating storages, not editing their content types.
- name: Enable snippets on local storage
  hosts: pve_primary
  gather_facts: false
  tasks:
    - name: Read current content types for local
      ansible.builtin.command: pvesh get /storage/local --output-format json
      register: _localstore
      changed_when: false
      check_mode: false

    - name: Add snippets to local storage content types
      ansible.builtin.command: pvesm set local --content iso,vztmpl,backup,import,snippets
      when: "'snippets' not in (_localstore.stdout | from_json).content"

    - name: Confirm snippets is enabled
      ansible.builtin.command: pvesh get /storage/local --output-format json
      register: _after
      changed_when: false
      check_mode: false
      failed_when: "'snippets' not in (_after.stdout | from_json).content"

# Container feature flags.
#
# nesting: Debian services hardened with systemd user namespaces (prometheus,
#   grafana) fail without it.
# keyctl:  Docker needs it for its kernel keyring use.
#
# Set here rather than in OpenTofu: the API rejects the provider's write
# because it sends the whole feature struct, and everything except nesting is
# root@pam-only. Ansible reaches the host as root, so it can set all of them.
- name: Set container feature flags
  hosts: pve
  gather_facts: false
  vars:
    container_features:
      142: "nesting=1"                # monitoring: prometheus/grafana
      141: "nesting=1"                # svc-core
      143: "nesting=1"                # forgejo
      152: "nesting=1,keyctl=1"       # ci-runner: docker
  tasks:
    - name: Find which containers live on this node
      ansible.builtin.command: pct list
      register: _pctlist
      changed_when: false
      check_mode: false

    - name: Read current features
      ansible.builtin.command: pct config {{ item.key }}
      loop: "{{ container_features | dict2items }}"
      loop_control:
        label: "ct {{ item.key }}"
      when: "item.key | string in _pctlist.stdout"
      register: _ctfeat
      changed_when: false
      check_mode: false

    - name: Apply feature flags
      ansible.builtin.command: pct set {{ item.item.key }} --features {{ item.item.value }}
      loop: "{{ _ctfeat.results }}"
      loop_control:
        label: "ct {{ item.item.key | default('') }} -> {{ item.item.value | default('') }}"
      when:
        - not item.skipped | default(false)
        - "'features: ' ~ item.item.value not in item.stdout"
      register: _featset

    - name: Restart containers whose features changed
      ansible.builtin.command: pct reboot {{ item.item.item.key }}
      loop: "{{ _featset.results }}"
      loop_control:
        label: "ct {{ item.item.item.key | default('') }}"
      when: item is changed
