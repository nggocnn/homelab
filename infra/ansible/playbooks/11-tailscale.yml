---
# Install Tailscale and advertise the subnet. Log in by hand on each router, then re-run.
# One router carries the subnet at a time; Tailscale fails over to another if it goes away.
#
#   tailscale up          # routes and accept-dns are reconciled by the role afterwards
#
#   ansible-playbook playbooks/11-tailscale.yml
- name: Install Tailscale
  hosts: tailscale
  gather_facts: false
  roles:
    - apt_packages
    - tailscale
