---
# tailscale-01..03: created, then Tailscale installed and the subnet advertised. Log in by hand on each router, then re-run.
# One router carries the subnet at a time; Tailscale fails over to another if it goes away.
#
#   tailscale up          # routes and accept-dns are reconciled by the role afterwards
#
# With TS_API_KEY exported the role approves the routes too, and
# -e tailscale_login_with_authkey=true replaces the manual login entirely.
#
#   ansible-playbook playbooks/11-tailscale.yml
- name: Controller certificate
  ansible.builtin.import_playbook: _ssh-cert.yml

- name: Tailscale
  hosts: tailscale
  gather_facts: false
  roles:
    - pve_lxc
    - guest_ssh
    - apt_packages
    - tailscale
