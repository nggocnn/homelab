[defaults]
inventory          = inventory/hosts.yml
roles_path         = ./roles
collections_path   = ./collections
host_key_checking  = True
result_format      = yaml
callbacks_enabled  = profile_tasks
interpreter_python = auto_silent
forks              = 3
retry_files_enabled = False
# The secret files are ansible-vault encrypted (tools/vault-secrets.sh); lookup('file') and copy
# decrypt them on the fly. The password comes from ~/.config/homelab/vault-pass, or a prompt.
vault_password_file = tools/vault-pass.sh

[ssh_connection]
pipelining = True
# IdentitiesOnly: the agent holds the CAs for signing, and offering them first runs into MaxAuthTries.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
