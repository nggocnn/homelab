---
# lineinfile, not ansible.posix.authorized_key: that module chowns the file to root:root after
# writing it, and on a clustered node the file lives on /etc/pve (pmxcfs), which allows only
# root:www-data - "Operation not permitted" after the write. lineinfile writes through the
# symlink (atomic_move resolves it) and leaves ownership alone. Matched on the key blob, so
# a key already there under another comment or options is updated, not added twice. No `mode`:
# on the symlink it reads as 0777 and reports a change every run. The installer creates the file.
- name: Authorise root SSH keys
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    search_string: "{{ item | regex_search('AAAA[0-9A-Za-z+/=]+') }}"
    line: "{{ item }}"
  loop: "{{ pve_root_authorized_keys }}"
  loop_control:
    label: "{{ item.split() | last }}"

- name: Assert root has at least one authorised key before hardening SSH
  ansible.builtin.stat:
    path: /root/.ssh/authorized_keys
  register: _authkeys
  failed_when: not _authkeys.stat.exists or _authkeys.stat.size == 0

# `validate` runs sshd -t against the candidate file, so a malformed drop-in is
# rejected before it is ever installed.
- name: Harden SSH to key-only root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-pve-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # {{ pve_managed_note }}
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  notify: reload sshd

- name: Revoked keys and host certificate
  ansible.builtin.import_role:
    name: ssh_ca
    tasks_from: host
