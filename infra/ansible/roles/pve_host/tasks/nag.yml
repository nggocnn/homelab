---
- name: Install the subscription-nag removal script
  ansible.builtin.copy:
    src: pve-remove-nag.sh
    dest: /usr/local/bin/pve-remove-nag.sh
    owner: root
    group: root
    mode: "0755"

# The nag returns every time proxmox-widget-toolkit is upgraded, so re-apply
# the patch from an APT hook rather than relying on running this role again.
- name: Re-apply the nag patch after every apt run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-pve-no-nag
    owner: root
    group: root
    mode: "0644"
    content: |
      DPkg::Post-Invoke { "/usr/local/bin/pve-remove-nag.sh || true"; };

- name: Check whether the nag patch is already applied
  ansible.builtin.command:
    cmd: grep -q 'orig_cmd(); return;' /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
  register: _nag_patched
  changed_when: false
  failed_when: false
  check_mode: false

- name: Apply the nag patch now
  ansible.builtin.command:
    cmd: /usr/local/bin/pve-remove-nag.sh
  when: _nag_patched.rc != 0
  changed_when: true
  notify: restart pveproxy
