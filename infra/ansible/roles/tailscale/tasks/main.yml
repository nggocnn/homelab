---
# Install and subnet routing. Logged in by hand: tailscale up

- name: Install the Tailscale package signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Add the Tailscale apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main

# update_cache on the install itself, so a run that died after adding the repo still sees the package.
- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Look for /dev/net/tun
  ansible.builtin.stat:
    path: /dev/net/tun
  register: _tun

- name: Assert /dev/net/tun is passed through
  ansible.builtin.assert:
    that: _tun.stat.exists and _tun.stat.ischr
    fail_msg: /dev/net/tun missing - set lxc_devices and recreate the container, or `pct set <vmid> --dev0 /dev/net/tun`.
    quiet: true

- name: Enable and start tailscaled
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started

- name: Enable IP forwarding for subnet routing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
  register: _ts_sysctl

- name: Apply IP forwarding now
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
  when:
    - _ts_sysctl.changed
    - not ansible_check_mode

- name: Read the Tailscale state
  ansible.builtin.command:
    cmd: tailscale debug prefs
  register: _ts_prefs
  changed_when: false
  check_mode: false

- name: Read the Tailscale backend state
  ansible.builtin.command:
    cmd: tailscale status --json
  register: _ts_status
  changed_when: false
  failed_when: false
  check_mode: false

# Skipped until logged in; re-run the playbook after `tailscale up`.
- name: Advertise subnet routes
  ansible.builtin.command:
    cmd: tailscale set --advertise-routes={{ tailscale_advertise_routes | join(',') }}
  when:
    - (_ts_status.stdout | from_json).BackendState == 'Running'
    - ((_ts_prefs.stdout | from_json).AdvertiseRoutes or []) | sort != tailscale_advertise_routes | sort
