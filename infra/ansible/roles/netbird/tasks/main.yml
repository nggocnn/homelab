---
# Install, service and first login. Routes, policies and DNS are set in the NetBird dashboard.

# Armored; apt reads a .asc keyring as it is.
- name: Install the NetBird package signing key
  ansible.builtin.get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /usr/share/keyrings/netbird-archive-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the NetBird apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/netbird.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.asc] https://pkgs.netbird.io/debian stable main

# update_cache on the install itself, so a run that died after adding the repo still sees the package.
- name: Install netbird
  ansible.builtin.apt:
    name: netbird
    state: present
    update_cache: true

- name: Look for /dev/net/tun
  ansible.builtin.stat:
    path: /dev/net/tun
  register: _tun

- name: Assert /dev/net/tun is passed through
  ansible.builtin.assert:
    that: _tun.stat.exists and _tun.stat.ischr
    fail_msg: /dev/net/tun missing - set lxc_devices and recreate the container, or `pct set <vmid> --dev0 /dev/net/tun`.
    quiet: true

# The package ships the binary only; the daemon's unit comes from the CLI.
- name: Install the netbird service
  ansible.builtin.command:
    cmd: netbird service install
    creates: /etc/systemd/system/netbird.service

- name: Enable and start netbird
  ansible.builtin.service:
    name: netbird
    enabled: true
    state: started

- name: Enable IP forwarding for the routing peer
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-netbird.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
  register: _nb_sysctl

# Only this file: `sysctl --system` also applies host-only keys and exits 1 in an unprivileged LXC.
- name: Apply IP forwarding now
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-netbird.conf
  changed_when: false
  when:
    - _nb_sysctl.changed
    - not ansible_check_mode

- name: Read the NetBird state
  ansible.builtin.command:
    cmd: netbird status --json
  register: _nb_status
  changed_when: false
  failed_when: false
  check_mode: false

# Before login the CLI prints "NeedsLogin" text, not JSON.
- name: Parse the NetBird state
  ansible.builtin.set_fact:
    _nb_connected: "{{ _nb_status.stdout is match('\\s*\\{') and ((_nb_status.stdout | from_json).management.connected | default(false)) }}"

- name: Log in with the setup key
  ansible.builtin.command:
    cmd: netbird up --setup-key {{ netbird_setup_key }} {{ netbird_up_flags | join(' ') }}
  no_log: true
  when:
    - netbird_setup_key | length > 0
    - not _nb_connected | bool
  register: _nb_up

- name: Read the NetBird state after login
  ansible.builtin.command:
    cmd: netbird status --json
  register: _nb_after
  changed_when: false
  check_mode: false
  when: _nb_up is changed

- name: Report
  vars:
    _out: "{{ (_nb_after.stdout if _nb_up is changed else _nb_status.stdout) | default('', true) }}"
    _s: "{{ (_out | from_json) if _out is match('\\s*\\{') else {} }}"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {% if _s.management.connected | default(false) -%}
      netbird {{ _s.daemonVersion | default('?') }}, {{ _s.netbirdIp | default('?') }}
      {%- else -%}
      not logged in - write {{ netbird_setup_key_file | basename }} or `netbird up --setup-key <key>`, then re-run
      {%- endif %}
