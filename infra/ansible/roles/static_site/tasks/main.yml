---
- name: Assert the source folder exists
  ansible.builtin.assert:
    that: (static_site_src | length > 0) and (static_site_src ~ '/index.html') is file
    fail_msg: "No index.html in static_site_src={{ static_site_src }}"
    quiet: true
  delegate_to: localhost

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create {{ static_site_root }}
  ansible.builtin.file:
    path: "{{ static_site_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy the pages
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ static_site_root }}/"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ query('ansible.builtin.fileglob', *(static_site_files | map('regex_replace', '^', static_site_src ~ '/'))) }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Copy the folders
  ansible.builtin.copy:
    src: "{{ static_site_src }}/{{ item }}"
    dest: "{{ static_site_root }}/"
    owner: root
    group: root
    directory_mode: "0755"
    mode: "0644"
  loop: "{{ static_site_dirs }}"

# copy only adds and overwrites. To make the web root match the source, list what the source
# holds and delete the rest. Plain find + file instead of synchronize: no rsync in the
# controller image, and the SSH hop through the bastion.
- name: List the source pages
  ansible.builtin.find:
    paths: "{{ static_site_src }}"
    patterns: "{{ static_site_files }}"
    file_type: file
  register: _site_src_pages
  delegate_to: localhost
  become: false

- name: List the source folders
  ansible.builtin.find:
    paths: "{{ static_site_dirs | map('regex_replace', '^', static_site_src ~ '/') | list }}"
    recurse: true
    file_type: file
  register: _site_src_dirs
  delegate_to: localhost
  become: false
  when: static_site_dirs | length > 0

- name: List what is served
  ansible.builtin.find:
    paths: "{{ static_site_root }}"
    recurse: true
    file_type: file
    hidden: true
  register: _site_served

- name: Delete what the source no longer has
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _site_served.files | map(attribute='path') | reject('in', _site_keep) | list }}"
  vars:
    _site_keep: >-
      {{ (_site_src_pages.files + (_site_src_dirs.files | default([])))
         | map(attribute='path') | map('relpath', static_site_src)
         | map('regex_replace', '^', static_site_root ~ '/') | list }}

- name: Write the site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/site
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable the site, disable the default
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/{{ item.name }}"
    src: "{{ item.src | default(omit) }}"
    state: "{{ item.state }}"
  loop:
    - { name: site, src: /etc/nginx/sites-available/site, state: link }
    - { name: default, state: absent }
  notify: reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
