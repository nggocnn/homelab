---
# The floating address and who may hold it. Highest priority wins and preempts.
keepalived_vip: ""
keepalived_priority: 100
keepalived_peers: []          # the other members' addresses, for unicast VRRP
keepalived_interface: eth0
keepalived_router_id: 51      # must match across the group and be unique on the LAN
keepalived_advert_int: 1

# Health checks. Each is { name, script }; a failing one costs keepalived_check_weight
# priority, so the VIP leaves a host whose service died but which is still up.
#
# The weight must be LARGER than the gap between neighbouring priorities. At -50 with
# priorities 50 apart, one failed check only levels the holder with its peer, and VRRP
# breaks the tie on the higher IP rather than on health.
keepalived_scripts: []
keepalived_check_interval: 2
keepalived_check_weight: -60
