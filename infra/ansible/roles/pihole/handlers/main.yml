---
# `pihole-FTL --config` writes pihole.toml and FTL picks most keys up live; reloading
# the DNS side is the cheap way to be certain, and it does not drop the cache.
- name: reload pihole dns
  ansible.builtin.command:
    cmd: pihole reloaddns
  changed_when: true

# Downloads and rebuilds the blocklists. Minutes, not seconds, so it runs once at the end.
- name: update gravity
  ansible.builtin.command:
    cmd: pihole -g
  changed_when: true
