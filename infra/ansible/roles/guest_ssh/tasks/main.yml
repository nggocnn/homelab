---
- name: Authorise only the user CA for {{ guest_ssh_user }}
  ansible.posix.authorized_key:
    user: "{{ guest_ssh_user }}"
    key: "{{ guest_ssh_authorized_keys | join('\n') }}"
    state: present
    exclusive: true

- name: Revoked keys and host certificate
  ansible.builtin.import_role:
    name: ssh_ca
    tasks_from: host

# `validate` runs sshd -t against the candidate file, so a malformed drop-in is never installed.
- name: Install sshd config {{ guest_ssh_config }}
  ansible.builtin.copy:
    src: "{{ guest_ssh_config }}"
    dest: /etc/ssh/sshd_config.d/10-guest-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: guest_ssh_harden | bool
  notify: restart sshd

- name: Remove sshd config
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-guest-hardening.conf
    state: absent
  when: not guest_ssh_harden | bool
  notify: restart sshd
