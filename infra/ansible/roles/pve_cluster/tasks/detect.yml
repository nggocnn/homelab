---
# Membership state, re-read wherever it is needed.
#`pvecm status` exits non-zero on a standalone node;
# corosync.conf only exists once a cluster is formed, so
# the two together are a reliable signal.

- name: Look for a corosync config
  ansible.builtin.stat:
    path: /etc/pve/corosync.conf
  register: _corosync_conf

- name: Read the cluster status
  ansible.builtin.command:
    cmd: pvecm status
  register: _pvecm
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record membership
  ansible.builtin.set_fact:
    pve_is_clustered: "{{ _corosync_conf.stat.exists and _pvecm.rc == 0 }}"
    # The first `Name:` in the output is the cluster name; the membership table
    # further down has a Name column too, hence the anchored match. On a
    # standalone node `pvecm status` fails and there is nothing to match, so the
    # None has to be turned into a list before `first` sees it.
    pve_current_cluster: >-
      {{ (_pvecm.stdout | regex_search('^Name:\s+(\S+)', '\1', multiline=True)
          | default([], true) | first | default('')) }}
