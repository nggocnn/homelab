---
- name: Create the prometheus user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - { path: "{{ prometheus_dir }}", owner: root }
    - { path: "{{ prometheus_config_dir }}", owner: root }
    - { path: "{{ prometheus_config_dir }}/rules", owner: root }
    - { path: "{{ prometheus_data_dir }}", owner: prometheus }

- name: Read the installed version
  ansible.builtin.command:
    cmd: "{{ prometheus_dir }}/prometheus --version"
  register: _prometheus_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Prometheus {{ prometheus_version }}
  ansible.builtin.unarchive:
    src: https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
    dest: "{{ prometheus_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: root
    group: root
  when: prometheus_version not in _prometheus_installed.stderr | default('') + _prometheus_installed.stdout | default('')
  notify: restart prometheus

- name: Write the rules
  ansible.builtin.template:
    src: rules.yml.j2
    dest: "{{ prometheus_config_dir }}/rules/homelab.yml"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ prometheus_dir }}/promtool check rules %s"
  notify: reload prometheus

- name: Write the config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ prometheus_dir }}/promtool check config --syntax-only %s"
  notify: reload prometheus

- name: Install the unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus

- name: Enable and start prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
