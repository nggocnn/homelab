---
- name: Create the node-exp user
  ansible.builtin.user:
    name: node-exp
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Read the installed version
  ansible.builtin.command:
    cmd: /usr/local/bin/node_exporter --version
  register: _node_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the node exporter {{ node_exporter_version }}
  ansible.builtin.unarchive:
    src: https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1]
    include: ["node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"]
    owner: root
    group: root
  when: node_exporter_version not in _node_exporter_installed.stderr | default('') + _node_exporter_installed.stdout | default('')
  notify: restart node_exporter

- name: Install the unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
