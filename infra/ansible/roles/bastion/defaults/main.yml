---
# Console login with password, then SSH to containers. SSH itself stays key-only (guest_ssh_harden).
bastion_user: nggocnn
bastion_password_hash_file: "{{ playbook_dir }}/../bastion-password.hash" # mkpasswd -m yescrypt, gitignored

# Generated on the bastion and signed by the user CA (ssh_certs.bastion): no nodes, no edge
# containers, and only from the bastion's own address. -e bastion_rotate=true replaces the key.
bastion_identity_file: /home/{{ bastion_user }}/.ssh/id_lxc
bastion_rotate: false
