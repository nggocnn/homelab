---
- name: Read the password hash
  ansible.builtin.set_fact:
    _password_hash: "{{ lookup('ansible.builtin.file', bastion_password_hash_file, errors='ignore') | default('', true) | trim }}"
  no_log: true

- name: Assert the password hash exists
  ansible.builtin.assert:
    that: _password_hash is match('^\$')
    fail_msg: "Missing {{ bastion_password_hash_file | realpath }} - create it with: mkpasswd -m yescrypt > bastion-password.hash"
    quiet: true

- name: Install sudo and openssh-client
  ansible.builtin.apt:
    name:
      - sudo
      - openssh-client # ssh-keygen, used by openssh_keypair
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create {{ bastion_user }}
  ansible.builtin.user:
    name: "{{ bastion_user }}"
    password: "{{ _password_hash }}"
    update_password: always
    shell: /bin/bash
    groups: sudo
    append: true
  no_log: true

- name: Create /home/{{ bastion_user }}/.ssh
  ansible.builtin.file:
    path: /home/{{ bastion_user }}/.ssh
    state: directory
    owner: "{{ bastion_user }}"
    group: "{{ bastion_user }}"
    mode: "0700"

- name: Authorise only the listed keys for {{ bastion_user }}
  ansible.posix.authorized_key:
    user: "{{ bastion_user }}"
    key: "{{ bastion_authorized_keys | join('\n') }}"
    state: present
    exclusive: true

- name: Write ~/.ssh/config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: /home/{{ bastion_user }}/.ssh/config
    owner: "{{ bastion_user }}"
    group: "{{ bastion_user }}"
    mode: "0600"

- name: Generate the guest key
  community.crypto.openssh_keypair:
    path: "{{ bastion_identity_file }}"
    type: ed25519
    comment: "{{ bastion_user }}@{{ inventory_hostname }}"
    owner: "{{ bastion_user }}"
    group: "{{ bastion_user }}"
    mode: "0600"
    regenerate: "{{ 'always' if bastion_rotate | bool else 'never' }}"

- name: Certificate for the guest key
  ansible.builtin.import_role:
    name: ssh_ca
    tasks_from: remote
  vars:
    ssh_ca_remote: "{{ ssh_certs.bastion | combine({
      'type': 'user',
      'id': bastion_user ~ '@' ~ inventory_hostname,
      'options': ['clear', 'permit-pty', 'source-address=' ~ ansible_host],
      'key_pub': bastion_identity_file ~ '.pub',
      'cert_path': bastion_identity_file ~ '-cert.pub',
      'owner': bastion_user
      }) }}"

- name: Trust the host CA
  ansible.builtin.copy:
    dest: /etc/ssh/ssh_known_hosts
    content: "{{ ssh_host_ca_line }}\n"
    owner: root
    group: root
    mode: "0644"
