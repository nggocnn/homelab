---
# Probes from outside: whether an address answers. Monitors come from the autokuma role;
# the status page is made in the web UI.

- name: Install nodejs, npm and git
  ansible.builtin.apt:
    name:
      - nodejs   # 20.19 in Debian 13; Uptime Kuma needs 20.4+
      - npm
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the kuma user
  ansible.builtin.user:
    name: kuma
    system: true
    shell: /usr/sbin/nologin
    home: "{{ uptime_kuma_data_dir }}"
    create_home: true

# The git module only ever clones here, never updates: on an existing shallow clone at a tag
# it looks for refs/remotes/origin/HEAD, which such a clone lacks, and fails with "'NoneType'
# object has no attribute 'startswith'" (ansible-core 2.20.11, 2026-11-25). So the tag is read
# first, a checkout of another version is removed, and a fresh clone takes its place. The data
# lives in {{ uptime_kuma_data_dir }}, not here.
- name: Read the checked-out version
  ansible.builtin.command:
    cmd: git -C {{ uptime_kuma_dir }} describe --tags --exact-match
  register: _kuma_tag
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove the checkout of another version
  ansible.builtin.file:
    path: "{{ uptime_kuma_dir }}"
    state: absent
  when: _kuma_tag.rc == 0 and _kuma_tag.stdout != uptime_kuma_version

- name: Clone Uptime Kuma {{ uptime_kuma_version }}
  ansible.builtin.git:
    repo: https://github.com/louislam/uptime-kuma.git
    dest: "{{ uptime_kuma_dir }}"
    version: "{{ uptime_kuma_version }}"
    depth: 1
  register: _kuma_clone
  when: _kuma_tag.stdout | default('') != uptime_kuma_version

# npm run setup, minus its git checkout: the clone above is already at the tag.
- name: Install the dependencies
  ansible.builtin.command:
    cmd: npm ci --omit dev --no-audit
    chdir: "{{ uptime_kuma_dir }}"
  when: _kuma_clone is changed
  changed_when: true
  notify: restart uptime-kuma

- name: Fetch the prebuilt frontend
  ansible.builtin.command:
    cmd: node extra/download-dist.js
    chdir: "{{ uptime_kuma_dir }}"
  when: _kuma_clone is changed
  changed_when: true
  notify: restart uptime-kuma

- name: Own the data directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_data_dir }}"
    state: directory
    owner: kuma
    group: kuma
    mode: "0750"

- name: Install the unit
  ansible.builtin.template:
    src: uptime-kuma.service.j2
    dest: /etc/systemd/system/uptime-kuma.service
    owner: root
    group: root
    mode: "0644"
  notify: restart uptime-kuma

- name: Enable and start uptime-kuma
  ansible.builtin.systemd_service:
    name: uptime-kuma
    enabled: true
    state: started
    daemon_reload: true
