---
# `local` is not shared, each node holds its own copy.
# Only add, a dropped entry is left in place.

- name: Assert every image entry is well-formed
  ansible.builtin.assert:
    that:
      - pve_lxc_templates | reject('string') | rejectattr('name', 'defined') | list | length == 0
      - pve_lxc_templates | reject('string') | rejectattr('src', 'defined') | list | length == 0
      - pve_isos | rejectattr('name', 'defined') | list | length == 0
      - pve_isos | selectattr('url', 'defined') | selectattr('src', 'defined') | list | length == 0
      - pve_isos | rejectattr('url', 'defined') | rejectattr('src', 'defined') | list | length == 0
      - pve_isos | selectattr('url', 'defined') | rejectattr('checksum', 'defined') | list | length == 0
      - pve_cloud_images | rejectattr('name', 'defined') | list | length == 0
      - pve_cloud_images | selectattr('url', 'defined') | selectattr('src', 'defined') | list | length == 0
      - pve_cloud_images | rejectattr('url', 'defined') | rejectattr('src', 'defined') | list | length == 0
      - pve_cloud_images | selectattr('url', 'defined') | rejectattr('checksum', 'defined') | list | length == 0
    fail_msg: >-
      A template is a pveam name or { name, src, checksum? }. An ISO or cloud image has a name and
      exactly one of url (with checksum) or src.
    quiet: true
  run_once: true

# --- LXC templates ------------------------------------------------------------
- name: List the LXC templates on {{ pve_images_storage }}
  ansible.builtin.command:
    cmd: pveam list {{ pve_images_storage | quote }}
  register: _templates
  changed_when: false
  check_mode: false

- name: Name the missing templates
  ansible.builtin.set_fact:
    _missing_templates: "{{ pve_lxc_templates | select('string') | reject('in', _templates.stdout) | list }}"

- name: Refresh the appliance index
  ansible.builtin.command:
    cmd: pveam update
  changed_when: false
  when: _missing_templates | length > 0

# pveam verifies the download against the index checksum.
- name: Download missing templates
  ansible.builtin.command:
    cmd: pveam download {{ pve_images_storage | quote }} {{ item | quote }}
  loop: "{{ _missing_templates }}"
  throttle: "{{ pve_images_throttle }}"

- name: Push local templates
  ansible.builtin.include_tasks: push.yml
  vars:
    _volid: "{{ pve_images_storage }}:vztmpl/{{ _image.name }}"
  loop: "{{ pve_lxc_templates | reject('string') | list }}"
  loop_control:
    loop_var: _image
    label: "{{ _image.name }}"

# --- ISOs and VM disk images ---------------------------------------------------
- name: ISOs
  ansible.builtin.include_tasks: files.yml
  vars:
    _content: iso
    _images: "{{ pve_isos }}"

- name: VM disk images
  ansible.builtin.include_tasks: files.yml
  vars:
    _content: import
    _images: "{{ pve_cloud_images }}"
