---
# Hub: the binary, the systems from config.yml, then users and alerts through its API.

- name: Read the password
  ansible.builtin.set_fact:
    _beszel_password: "{{ lookup('ansible.builtin.file', beszel_password_file, errors='ignore') | default('', true) | trim }}"
  no_log: true

- name: Assert the password exists
  ansible.builtin.assert:
    that: _beszel_password | length >= 8
    fail_msg: "Missing or short {{ beszel_password_file | realpath }} - create it with: read -rsp 'Beszel password: ' p && printf '%s' \"$p\" > beszel-password"
    quiet: true

- name: Install openssh-client
  ansible.builtin.apt:
    name: openssh-client # ssh-keygen, used by openssh_keypair
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the beszel user
  ansible.builtin.user:
    name: beszel
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ beszel_dir }}", owner: root, mode: "0755" } # the beszel user executes the binary
    - { path: /etc/beszel, owner: root, mode: "0750" }
    - { path: "{{ beszel_data_dir }}", owner: beszel, mode: "0750" }

- name: Read the installed version
  ansible.builtin.command:
    cmd: "{{ beszel_dir }}/beszel --version"
  register: _beszel_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Beszel {{ beszel_version }}
  ansible.builtin.unarchive:
    src: https://github.com/henrygd/beszel/releases/download/v{{ beszel_version }}/beszel_linux_amd64.tar.gz
    dest: "{{ beszel_dir }}"
    remote_src: true
    include: [beszel]
    owner: root
    group: root
    mode: "0755"
  when: beszel_version not in _beszel_installed.stdout | default('')
  notify: restart beszel

# Generated here rather than by the hub on first start, so the agents can be given the
# public half without waiting on the service.
- name: Generate the hub key
  community.crypto.openssh_keypair:
    path: "{{ beszel_data_dir }}/id_ed25519"
    type: ed25519
    owner: beszel
    group: beszel
    comment: "{{ inventory_hostname }}"
  register: _beszel_key

- name: Publish the hub public key
  ansible.builtin.set_fact:
    beszel_hub_public_key: "{{ _beszel_key.public_key }}"

- name: Write the environment
  ansible.builtin.template:
    src: hub.env.j2
    dest: /etc/beszel/hub.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart beszel

- name: Write the systems
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ beszel_data_dir }}/config.yml"
    owner: beszel
    group: beszel
    mode: "0640"
  notify: restart beszel

- name: Install the unit
  ansible.builtin.template:
    src: beszel.service.j2
    dest: /etc/systemd/system/beszel.service
    owner: root
    group: root
    mode: "0644"
  notify: restart beszel

- name: Enable and start beszel
  ansible.builtin.systemd_service:
    name: beszel
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so the API reflects the config
  ansible.builtin.meta: flush_handlers

- name: Wait for the API
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ beszel_port }}/api/health
  register: _beszel_health
  until: _beszel_health.status == 200
  retries: 30
  delay: 2

- name: Configure users and alerts
  ansible.builtin.import_tasks: api.yml
  vars:
    _api: http://127.0.0.1:{{ beszel_port }}/api
    _headers: { Authorization: "{{ _auth.json.token }}" }
    _user: "{{ _users.json['items'][0] }}"
