---
- name: Read the Telegram bot token
  ansible.builtin.set_fact:
    _telegram_token: "{{ lookup('ansible.builtin.file', telegram_bot_token_file, errors='ignore') | default('', true) | trim }}"
  no_log: true

- name: Assert the Telegram settings exist
  ansible.builtin.assert:
    that:
      - _telegram_token is match('^[0-9]+:')
      - telegram_chat_id is match('^-?[0-9]+$')
    fail_msg: >-
      Needs {{ telegram_bot_token_file | realpath }} (the token from @BotFather) and {{ telegram_chat_id_file | realpath }}
      (message the bot, then: curl -s https://api.telegram.org/bot<token>/getUpdates).
    quiet: true

- name: Create the alertmanager user
  ansible.builtin.user:
    name: alertmanager
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ alertmanager_dir }}", owner: root, mode: "0755" }
    - { path: "{{ alertmanager_config_dir }}", owner: alertmanager, mode: "0750" }
    - { path: "{{ alertmanager_data_dir }}", owner: alertmanager, mode: "0750" }

- name: Read the installed version
  ansible.builtin.command:
    cmd: "{{ alertmanager_dir }}/alertmanager --version"
  register: _alertmanager_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Alertmanager {{ alertmanager_version }}
  ansible.builtin.unarchive:
    src: https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz
    dest: "{{ alertmanager_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: root
    group: root
  when: alertmanager_version not in _alertmanager_installed.stderr | default('') + _alertmanager_installed.stdout | default('')
  notify: restart alertmanager

- name: Write the bot token
  ansible.builtin.copy:
    content: "{{ _telegram_token }}\n"
    dest: "{{ alertmanager_config_dir }}/telegram-token"
    owner: alertmanager
    group: alertmanager
    mode: "0600"
  no_log: true
  notify: restart alertmanager

- name: Write the config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: alertmanager
    group: alertmanager
    mode: "0640"
    validate: "{{ alertmanager_dir }}/amtool check-config %s"
  notify: restart alertmanager

- name: Install the unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alertmanager

- name: Enable and start alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    enabled: true
    state: started
    daemon_reload: true
