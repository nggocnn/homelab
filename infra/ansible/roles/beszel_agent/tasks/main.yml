---
# Agent on the host: CPU, memory, disks, network, temperatures, SMART and systemd units.
# The hub dials in over SSH on beszel_agent_listen.

- name: Read the hub public key
  ansible.builtin.slurp:
    src: "{{ beszel_hub_data_dir }}/id_ed25519.pub"
  delegate_to: "{{ beszel_hub_host }}"
  run_once: true
  register: _beszel_hub_pub

- name: Keep the key
  ansible.builtin.set_fact:
    _beszel_hub_key: "{{ (_beszel_hub_pub.content | b64decode).split()[:2] | join(' ') }}"

- name: Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: Create the beszel user
  ansible.builtin.user:
    name: beszel
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Read the installed version
  ansible.builtin.command:
    cmd: /usr/local/bin/beszel-agent --version
  register: _beszel_agent_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the Beszel agent {{ beszel_agent_version }}
  ansible.builtin.unarchive:
    src: https://github.com/henrygd/beszel/releases/download/v{{ beszel_agent_version }}/beszel-agent_linux_amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [beszel-agent]
    owner: root
    group: root
    mode: "0755"
  when: beszel_agent_version not in _beszel_agent_installed.stdout | default('')
  notify: restart beszel-agent

- name: Install the unit
  ansible.builtin.template:
    src: beszel-agent.service.j2
    dest: /etc/systemd/system/beszel-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: restart beszel-agent

- name: Enable and start beszel-agent
  ansible.builtin.systemd_service:
    name: beszel-agent
    enabled: true
    state: started
    daemon_reload: true
